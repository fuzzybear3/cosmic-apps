[package]
name = "cosmic-applet-github-ci"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "COSMIC panel applet showing GitHub Actions CI/CD workflow status"
repository = "https://github.com/fuzzybear3/cosmic-apps"

[[bin]]
name = "cosmic-applet-github-ci"
path = "src/main.rs"

[dependencies]
futures = "0.3"
futures-util = "0.3.31"
i18n-embed-fl = "0.10"
rust-embed = "8.7.2"
tokio = { version = "1.48.0", features = ["full"] }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "x11",
]
