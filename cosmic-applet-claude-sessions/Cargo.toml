[package]
name = "cosmic-applet-claude-sessions"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "COSMIC panel applet showing running Claude Code sessions and which need attention"
repository = "https://github.com/fuzzybear3/cosmic-apps"

[lib]
name = "cosmic_applet_claude_sessions"
path = "src/lib.rs"

[[bin]]
name = "cosmic-applet-claude-sessions"
path = "src/main.rs"

[[bin]]
name = "cosmic-claude-attention-card"
path = "src/bin/cosmic-claude-attention-card.rs"

[dependencies]
futures = "0.3"
futures-util = "0.3.31"
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

# Native window activation via COSMIC's toplevel protocols (no external helper).
# Versions pinned to what libcosmic already resolves so builds are reused.
sctk = { package = "smithay-client-toolkit", version = "0.20" }
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols", rev = "160b086" }
calloop = "0.14"
calloop-wayland-source = "0.4"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "x11",
]
